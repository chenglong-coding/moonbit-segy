name: verify
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$(cat .moonbit-version)"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - run: moon update
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: moon fmt --check
      - run: moon check --target all --deny-warn
      - run: moon test --target js --deny-warn
      - run: moon test --target wasm-gc --deny-warn
      - run: moon build --target js --release --deny-warn
      - run: moon info
      - run: git diff --exit-code -- '*.mbti'
      - run: node tools/check-cli.mjs
      - run: python -m pip install -r tools/requirements.txt
      - run: python tools/verify-reference.py
      - run: python tools/verify-quality.py
      - run: moon run examples/quality_check --target js
      - run: moon run examples/quality_check --target wasm-gc
      - run: python tools/verify-public-usgs.py --evidence evidence/public-usgs-ci.json
      - run: node examples/run-public-qc.mjs work/usgs-qc
